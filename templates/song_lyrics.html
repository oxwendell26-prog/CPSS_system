{# Pahina ng lyrics ng isang napiling kanta #}
{% extends "base.html" %}

{% block title %}{{ song.title }} · Songs{% endblock %}

{% block content %}
<div class="mx-auto max-w-3xl">
    <a href="{{ url_for('songs') }}" class="text-sm text-teal-800 hover:underline">Back to songs</a>
    <article class="mt-3 rounded-lg border border-slate-200 bg-white p-6">
        <div class="flex flex-wrap items-start justify-between gap-3">
            <h1 class="text-2xl font-semibold text-slate-900">{{ song.title }}</h1>
            <a href="{{ url_for('songs', edit=song.id) }}"
                class="text-sm text-teal-800 hover:underline">Edit lyrics</a>
        </div>
        <pre class="mt-6 whitespace-pre-wrap break-words font-sans text-sm leading-7 text-slate-700">{{ song.lyrics }}</pre>
    </article>
</div>
{% endblock %}
