{# Pahina para humiling ng password reset link sa recovery email #}
{% extends "base.html" %}

{% block title %}Forgot password · Church Program{% endblock %}

{% block content %}
<div class="mx-auto mt-8 max-w-sm rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    <h1 class="text-xl font-semibold text-slate-900">Forgot password?</h1>
    <p class="mt-1 text-sm text-slate-600">Enter your recovery email to receive a password reset link.</p>

    <form method="post" action="{{ url_for('forgot_password') }}" class="mt-6 space-y-4">
        <div>
            <label for="email" class="block text-sm font-medium text-slate-700">Recovery email</label>
            <input id="email" name="email" type="email" required maxlength="254" autofocus autocomplete="email"
                class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-teal-600 focus:outline-2 focus:outline-teal-600">
        </div>

        <button type="submit"
            class="w-full rounded-md bg-teal-700 px-4 py-2 text-sm font-medium text-white hover:bg-teal-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700">
            Send reset link
        </button>
    </form>

    <p class="mt-4 text-center text-sm">
        <a href="{{ url_for('login') }}" class="text-teal-800 hover:underline">Back to login</a>
    </p>
</div>
{% endblock %}
