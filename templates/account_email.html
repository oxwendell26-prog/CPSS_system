{# Pahina para baguhin ang recovery email ng admin account #}
{% extends "base.html" %}

{% block title %}Recovery email · Church Program{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
    <a href="{{ url_for('dashboard') }}" class="text-sm text-teal-800 hover:underline">Back to dashboard</a>

    <div class="mt-3 rounded-lg border border-slate-200 bg-white p-6">
        <h1 class="text-xl font-semibold text-slate-900">Recovery email</h1>
        <p class="mt-1 text-sm text-slate-600">Use an email address you can access to reset your password.</p>

        <form method="post" action="{{ url_for('account_email') }}" class="mt-6 space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700">Email address</label>
                <input id="email" name="email" type="email" required maxlength="254" value="{{ email }}"
                    autocomplete="email"
                    class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-teal-600 focus:outline-2 focus:outline-teal-600">
            </div>

            <button type="submit"
                class="rounded-md bg-teal-700 px-4 py-2 text-sm font-medium text-white hover:bg-teal-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700">
                Save recovery email
            </button>
        </form>
    </div>
</div>
{% endblock %}
