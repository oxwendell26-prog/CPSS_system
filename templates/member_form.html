{# Pahina para mag-edit ng isang miyembro #}
{% extends "base.html" %}

{% block title %}Edit member · Church Program{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">

    {# Link pabalik sa listahan #}
    <a href="{{ url_for('members') }}" class="text-sm text-teal-800 hover:underline">Back to members</a>

    <div class="mt-3 rounded-lg border border-slate-200 bg-white p-6">
        <h1 class="text-xl font-semibold text-slate-900">Edit member</h1>

        <form method="post" action="{{ url_for('edit_member', member_id=member.id) }}" class="mt-6 space-y-4">

            <div>
                <label for="full_name" class="block text-sm font-medium text-slate-700">Full name</label>
                {# Ang value ay galing sa "form" na ipinasa ng app.py #}
                <input id="full_name" name="full_name" type="text" required maxlength="100" autofocus
                    value="{{ form.full_name }}"
                    class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-teal-600 focus:outline-2 focus:outline-teal-600">
            </div>

            <div>
                <label for="display_name" class="block text-sm font-medium text-slate-700">Short name <span
                        class="font-normal text-slate-500">(optional)</span></label>
                <input id="display_name" name="display_name" type="text" maxlength="50" value="{{ form.display_name }}"
                    class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-teal-600 focus:outline-2 focus:outline-teal-600">
            </div>

            <div>
                <label for="contact_number" class="block text-sm font-medium text-slate-700">Contact number <span
                        class="font-normal text-slate-500">(optional)</span></label>
                <input id="contact_number" name="contact_number" type="text" maxlength="30"
                    value="{{ form.contact_number }}"
                    class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-teal-600 focus:outline-2 focus:outline-teal-600">
            </div>

            <div class="flex items-center gap-3">
                <button type="submit"
                    class="rounded-md bg-teal-700 px-4 py-2 text-sm font-medium text-white hover:bg-teal-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700">
                    Save changes
                </button>
                <a href="{{ url_for('members') }}" class="text-sm text-slate-600 hover:underline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
